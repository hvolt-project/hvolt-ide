<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow-x: hidden; }
  /* Tall diagrams scroll inside their card; the page must not hijack the gesture. */
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body { font-family: -apple-system, "HarmonyOS Sans", system-ui, sans-serif; }
  #out { padding: 8px; box-sizing: border-box; }
  /* The svg is scaled to the card width; its own height attribute is the pre-scale value. */
  #out svg { display: block; margin: 0 auto; max-width: 100% !important; height: auto !important; }
  #err { color: #E5484D; font-size: 12px; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out"></div>
<script src="mermaid.min.js"></script>
<script>

  function getBridge() {
    try { return window.bridge || null; } catch (e) { return null; }
  }

  function report(height) {
    try {
      var b = getBridge();
      if (b && b.setHeight) { b.setHeight(Math.ceil(height)); }
    } catch (e) {}
  }

  // Measure what the diagram actually occupies once it has been scaled to the card width. The
  // svg's declared height is the unscaled value, so the box is what counts.
  function measure() {
    var svg = document.querySelector('#out svg');
    if (!svg) { return 0; }
    // Only the drawing counts. Measuring the page or its container makes the card's own height
    // feed back into the next measurement, which is how it grew past its content.
    var height = svg.getBoundingClientRect().height;
    return height > 0 ? height + 16 : 0; // #out padding, top and bottom
  }

  function settle(attempt) {
    // Width becomes available one layout pass after the svg lands, so measure a few times and
    // keep reporting; the last value is the settled one.
    window.scrollTo(0, 0);
    report(measure());
    if (attempt < 3) {
      setTimeout(function () { settle(attempt + 1); }, attempt === 0 ? 80 : 200);
    }
  }

  function fail(message) {
    document.getElementById('out').innerHTML = '';
    var err = document.createElement('div');
    err.id = 'err';
    err.textContent = message;
    document.body.appendChild(err);
    report(64);
  }

  window.setBridge = function (b) { try { window.bridge = b; } catch (e) {} };

  window.renderDiagram = function (code, dark) {
    var out = document.getElementById('out');
    out.innerHTML = '';
    var old = document.getElementById('err');
    if (old) { old.remove(); }
    try {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: dark ? 'dark' : 'default',
        fontFamily: '-apple-system, "HarmonyOS Sans", system-ui, sans-serif'
      });
      mermaid.render('d' + Date.now(), code).then(function (result) {
        out.innerHTML = result.svg;
        var svg = out.querySelector('svg');
        if (svg) {
          svg.removeAttribute('height');
          svg.style.width = '100%';
          svg.style.height = 'auto';
        }
        settle(0);
      }).catch(function (e) {
        fail('mermaid: ' + (e && e.message ? e.message : String(e)));
      });
    } catch (e) {
      fail('mermaid: ' + (e && e.message ? e.message : String(e)));
    }
  };

  if (window.ResizeObserver) {
    var out = document.getElementById('out');
    if (out) {
      new ResizeObserver(function () {
        var height = measure();
        if (height > 0) { report(height); }
      }).observe(out);
    }
  }
</script>
</body>
</html>
