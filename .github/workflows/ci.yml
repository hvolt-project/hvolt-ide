name: ci

# Everything here runs on the host: the ArkTS surfaces are compiled by hvolt build for a device,
# and the native libraries need the HarmonyOS SDK clang, so neither can be built here. What is
# checkable is the pure logic (Node's type stripping runs it without a bundler), the import graph,
# and the shell scripts.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Type stripping is on by default from 22.6; the tests import `.ts` directly.
          node-version: '22'

      - name: node --test
        run: node --test test/

      - name: import graph
        run: python3 test/check-imports.py

      - name: shellcheck
        run: shellcheck scripts/*.sh